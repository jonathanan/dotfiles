# cheat (https://github.com/cheat/cheat) config. View a sheet with: cheat <name>
# The pager runs through sh so $HOME expands (cheat does not expand ~ or $HOME).
# To add sheets from another directory, point CHEAT_CONFIG_PATH at a config
# that lists this cheatpath plus the other one.
editor: nvim
colorize: false
style: monokai
formatter: terminal256
pager: sh -c $HOME/.dotfiles/bin/cheat-pager
cheatpaths:
  - name: personal
    path: ~/.dotfiles/cheat
    tags: [personal]
    readonly: false
