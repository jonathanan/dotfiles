[settings.node]
gpg_verify = false

[tools]
node = "lts"
python = "latest"
herdr = "latest"
fzf = "latest"
fd = "latest"
ripgrep = "latest"
bat = "latest"
"aqua:cheat/cheat" = "latest"
# Linux only. Official Linux builds need glibc 2.32+; neovim-releases also runs on older glibc.
# macOS gets neovim from macos/Brewfile.
"github:neovim/neovim-releases" = { version = "latest", os = ["linux"] }
"aqua:charmbracelet/glow" = "3.0.0"
