# Shared herdr config. bin/herdr-config-sync writes ~/.config/herdr/config.toml
# from this file plus ~/.config/herdr/config.local.toml (machine-specific, optional).

onboarding = false

# In-app toasts. "terminal" (ask the outer terminal for a desktop notification) did
# not reach the terminal through herdr --remote.
[ui.toast]
delivery = "herdr"
