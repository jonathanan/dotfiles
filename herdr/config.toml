# Shared herdr config. bin/herdr-config-sync writes ~/.config/herdr/config.toml
# from this file plus ~/.config/herdr/config.local.toml (machine-specific, optional).

onboarding = false

# In-app toasts. "terminal" (ask the outer terminal for a desktop notification) did
# not reach the terminal through herdr --remote.
[ui.toast]
delivery = "herdr"

# Prefix: ctrl+space instead of the default ctrl+b. It frees ctrl+b for shells, editors
# and copy-mode page-up. On macOS, check that "Select the previous input source"
# (System Settings > Keyboard > Keyboard Shortcuts > Input Sources) is off, or it takes
# ctrl+space before the terminal sees it.
[keys]
prefix = "ctrl+space"
